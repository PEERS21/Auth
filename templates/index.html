<!DOCTYPE html>
<html>
<head>
	<title>Slide Navbar</title>
	<link rel="stylesheet" href="/auth/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
	<div class="main">
		<input type="checkbox" id="chk" aria-hidden="true">
			<div class="signup">
				<form id='get'>
					<label for="chk" aria-hidden="true">Авторизация</label>
					<input type="text" name="login" id="login" placeholder="Ваш ник" required="">
                    <input type='hidden' id='state_get' value='{{state_get}}'>
					<button type='submit' id="btn_get">Получить код</button>
				</form>
			</div>

			<div class="login">
				<form id='verif'>
					<label for="chk" aria-hidden="true" style="padding-top: 13px;">Ввести код</label>
					<input type="password" name="code" id="code" placeholder="9999" required="">
                    <input type='hidden' id='state_verif' value='{{state}}'>
					<button type='submit' id="btn_verif">Я получил код!</button>
				</form>
			</div>
	</div>
    <script src="/auth/static/script.js"></script>
</body>
</html>
